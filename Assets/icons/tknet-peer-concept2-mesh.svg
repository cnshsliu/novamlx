<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="tknet peer — mesh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131B3E"/>
      <stop offset="1" stop-color="#080C1E"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </radialGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- ambient pulse around this peer -->
  <circle cx="512" cy="512" r="330" fill="url(#pulse)"/>

  <!-- mesh links -->
  <g stroke="url(#link)" stroke-width="22" stroke-linecap="round" opacity="0.9">
    <line x1="512" y1="512" x2="512" y2="212"/>
    <line x1="512" y1="512" x2="772" y2="362"/>
    <line x1="512" y1="512" x2="772" y2="662"/>
    <line x1="512" y1="512" x2="512" y2="812"/>
    <line x1="512" y1="512" x2="252" y2="662"/>
    <line x1="512" y1="512" x2="252" y2="362"/>
    <line x1="512" y1="212" x2="772" y2="362" opacity="0.4"/>
    <line x1="772" y1="362" x2="772" y2="662" opacity="0.4"/>
    <line x1="772" y1="662" x2="512" y2="812" opacity="0.4"/>
    <line x1="512" y1="812" x2="252" y2="662" opacity="0.4"/>
    <line x1="252" y1="662" x2="252" y2="362" opacity="0.4"/>
    <line x1="252" y1="362" x2="512" y2="212" opacity="0.4"/>
  </g>

  <!-- satellite peers -->
  <g fill="#818CF8">
    <circle cx="512" cy="212" r="52"/>
    <circle cx="772" cy="662" r="52"/>
    <circle cx="252" cy="662" r="52"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="772" cy="362" r="52"/>
    <circle cx="512" cy="812" r="52"/>
    <circle cx="252" cy="362" r="52"/>
  </g>

  <!-- this peer: the gateway core -->
  <circle cx="512" cy="512" r="96" fill="url(#core)"/>
  <circle cx="512" cy="512" r="44" fill="#0A0E22"/>
  <circle cx="512" cy="512" r="18" fill="#67E8F9"/>
</svg>
