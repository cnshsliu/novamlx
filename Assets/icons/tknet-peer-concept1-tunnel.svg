<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="tknet peer — tunnel gateway">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131B3E"/>
      <stop offset="1" stop-color="#080C1E"/>
    </linearGradient>
    <linearGradient id="beam" x1="120" y1="512" x2="904" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- portal glow -->
  <circle cx="512" cy="512" r="340" fill="url(#glow)"/>

  <!-- beam: traffic passing through the tunnel -->
  <line x1="120" y1="512" x2="904" y2="512" stroke="url(#beam)" stroke-width="26" stroke-linecap="round"/>

  <!-- packets on the wire -->
  <circle cx="262" cy="512" r="22" fill="#22D3EE"/>
  <circle cx="762" cy="512" r="22" fill="#818CF8"/>

  <!-- tunnel portal: two arcs with gaps at the sides where the beam passes through -->
  <path d="M 312.8 344.8 A 260 260 0 0 1 711.2 344.8" fill="none" stroke="url(#beam)" stroke-width="40" stroke-linecap="round"/>
  <path d="M 711.2 679.2 A 260 260 0 0 1 312.8 679.2" fill="none" stroke="url(#beam)" stroke-width="40" stroke-linecap="round"/>

  <!-- peer nodes -->
  <circle cx="140" cy="512" r="54" fill="#22D3EE"/>
  <circle cx="140" cy="512" r="26" fill="#0A0E22"/>
  <circle cx="884" cy="512" r="54" fill="#818CF8"/>
  <circle cx="884" cy="512" r="26" fill="#0A0E22"/>
</svg>
