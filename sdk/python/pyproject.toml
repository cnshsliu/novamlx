[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novamlx"
version = "0.1.0"
description = "Official Python SDK for NovaMLX — local LLM inference on Apple Silicon"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "NovaMLX Team" },
]
keywords = ["novamlx", "llm", "mlx", "apple-silicon", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/novamlx/novamlx"
Repository = "https://github.com/novamlx/novamlx"

[tool.hatch.build.targets.wheel]
packages = ["novamlx"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
