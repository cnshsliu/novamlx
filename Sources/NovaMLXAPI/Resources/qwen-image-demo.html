<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen-Image 2.1</title>
<style>
  :root {
    --bg: #12110e;
    --ink: #f3efe4;
    --muted: #9a9284;
    --line: #2c2923;
    --panel: #1b1915;
    --amber: #e4a15a;
    --danger: #e15b45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    padding: 22px 28px 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: inherit;
    text-decoration: none;
    min-width: 0;
  }
  .brand img { width: 36px; height: 36px; border-radius: 8px; }
  .brand strong {
    display: block;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 14px;
    letter-spacing: 0.08em;
  }
  .brand em {
    display: block;
    font-style: normal;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    color: var(--amber);
  }
  header h1 {
    margin: 0;
    font-weight: 560;
    font-size: 22px;
    letter-spacing: -0.03em;
  }
  header h1 span { color: var(--amber); }
  #status {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  main {
    display: grid;
    grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
    gap: 22px;
    padding: 12px 28px 28px;
    align-items: start;
  }
  form, .stage {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 16px;
  }
  label {
    display: block;
    margin: 12px 0 6px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  input[type="range"] { accent-color: var(--amber); padding: 8px 0; }
  textarea, input, select, button {
    width: 100%;
    font: 15px/1.4 "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: #0e0d0b;
    border: 1px solid var(--line);
    padding: 8px 10px;
  }
  textarea { min-height: 110px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    margin-top: 16px;
    background: var(--amber);
    color: #1a140c;
    border: 0;
    font-weight: 620;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: progress; }
  .hint, .err {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 12px;
    line-height: 1.45;
  }
  .hint { color: var(--muted); margin-top: 10px; }
  .err { color: var(--danger); min-height: 1.2em; margin-top: 8px; }
  .meter { margin-top: 12px; height: 8px; background: #0e0d0b; border: 1px solid var(--line); }
  .meter > div { height: 100%; width: 0%; background: var(--amber); }
  .stage {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .frame {
    flex: 1;
    min-height: 420px;
    display: grid;
    place-items: center;
    background:
      linear-gradient(45deg, #16140f 25%, transparent 25%),
      linear-gradient(-45deg, #16140f 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #16140f 75%),
      linear-gradient(-45deg, transparent 75%, #16140f 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    background-color: #201e19;
    border: 1px solid var(--line);
  }
  img { max-width: 100%; max-height: 72vh; display: block; }
  .empty { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }
  a.file {
    color: var(--amber);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 12px;
  }
  .history { display: flex; flex-direction: column; gap: 8px; }
  .history h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 560;
  }
  .history-bar { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .history-bar button { width: auto; margin: 0; padding: 6px 10px; background: transparent; color: var(--amber); border: 1px solid var(--line); }
  .shots { display: flex; gap: 8px; overflow-x: auto; }
  .shot { width: 148px; flex: 0 0 auto; }
  .shot img { width: 148px; height: 148px; object-fit: cover; max-height: none; border: 1px solid var(--line); }
  .shot p { margin: 4px 0 0; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); }
  .shot .prompt {
    color: var(--ink);
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: 12px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #refRow[hidden] { display: none; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    header { padding: 16px; }
    main { padding: 8px 16px 20px; }
    .frame { min-height: 280px; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="https://github.com/cnshsliu/novamlx">
    <img src="/demo/logo.png" alt="NovaMLX">
    <span>
      <strong>novamlx</strong>
      <em>https://github.com/cnshsliu/novamlx</em>
    </span>
  </a>
  <h1>Qwen-Image <span>2.1</span></h1>
  <div id="status">idle</div>
</header>
<main>
  <form id="form">
    <label for="model">Model</label>
    <select id="model" name="model"></select>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" name="prompt" required>A neon shop sign that reads "QWEN IMAGE 2.1", rainy night, reflections on wet pavement</textarea>
    <label for="negative">Negative prompt</label>
    <textarea id="negative" name="negative" placeholder="Leave empty for the official guidance-free sampler"></textarea>
    <div class="row">
      <div>
        <label for="size">Size</label>
        <select id="size" name="size">
          <option value="1024x1024" selected>1024 × 1024</option>
          <option value="1344x768">1344 × 768</option>
          <option value="768x1344">768 × 1344</option>
          <option value="1536x1024">1536 × 1024</option>
          <option value="2048x2048">2048 × 2048</option>
          <option value="2752x1536">2752 × 1536</option>
          <option value="1536x2752">1536 × 2752</option>
        </select>
      </div>
      <div>
        <label for="steps">Steps</label>
        <input id="steps" name="steps" type="number" min="1" max="50" value="20">
      </div>
    </div>
    <label for="seed">Seed</label>
    <input id="seed" name="seed" type="number" min="0" placeholder="random">
    <label for="reference">Reference image</label>
    <input id="reference" name="reference" type="file" accept="image/*">
    <div id="refRow" hidden>
      <label for="strength">Reference keep <span id="strengthValue">0.40</span></label>
      <input id="strength" name="strength" type="range" min="0.05" max="0.95" step="0.05" value="0.4">
    </div>
    <button id="go" type="submit">Generate</button>
    <div class="meter" aria-hidden="true"><div id="meter"></div></div>
    <p class="hint">40 steps is the official sampler. 20 is the faster preview. A reference image uses image-to-image; higher keep stays closer to that image. A negative prompt turns guidance on.</p>
    <div class="err" id="err"></div>
  </form>
  <section class="stage">
    <div class="frame" id="frame"><div class="empty">The image lands here.</div></div>
    <a class="file" id="save" hidden download="qwen-image.png">Download PNG</a>
    <div class="history">
      <div class="history-bar">
        <h2>History</h2>
        <button id="keep10" type="button">Keep last 10</button>
      </div>
      <div class="shots" id="shots"></div>
    </div>
  </section>
</main>
<script>
const params = new URLSearchParams(location.search);
let model = params.get("model") || "Qwen/Qwen-Image-2.1";
const key = params.get("key") || "";
const historyKey = "novamlx.imageDemo.history";
const form = document.getElementById("form");
const statusEl = document.getElementById("status");
const errEl = document.getElementById("err");
const frame = document.getElementById("frame");
const save = document.getElementById("save");
const go = document.getElementById("go");
const meter = document.getElementById("meter");
const modelSelect = document.getElementById("model");
const shots = document.getElementById("shots");
const reference = document.getElementById("reference");
const refRow = document.getElementById("refRow");
const strength = document.getElementById("strength");
const strengthValue = document.getElementById("strengthValue");
let timer = 0;

strength.addEventListener("input", () => {
  strengthValue.textContent = Number(strength.value).toFixed(2);
});
reference.addEventListener("change", () => {
  refRow.hidden = !reference.files || !reference.files.length;
});

function headers(json) {
  const h = {};
  if (json) h["Content-Type"] = "application/json";
  if (key) h.Authorization = "Bearer " + key;
  return h;
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(historyKey) || "[]"); }
  catch { return []; }
}

function saveHistory(items) {
  while (items.length) {
    try {
      localStorage.setItem(historyKey, JSON.stringify(items));
      return;
    } catch {
      items.pop();
    }
  }
  localStorage.removeItem(historyKey);
}

function renderHistory() {
  const items = loadHistory();
  shots.innerHTML = "";
  for (const item of items) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "shot";
    card.innerHTML = "<img alt=''><p class='prompt'></p><p class='meta'></p>";
    card.querySelector("img").src = item.image;
    card.querySelector(".prompt").textContent = item.prompt || "";
    card.querySelector(".meta").textContent = item.seconds + "s · " + item.model.split("/").pop();
    card.addEventListener("click", () => {
      frame.innerHTML = "";
      const img = document.createElement("img");
      img.alt = "Saved image";
      img.src = item.image;
      frame.appendChild(img);
      save.hidden = false;
      save.href = item.image;
      model = item.model;
      modelSelect.value = item.model;
      if (item.prompt) document.getElementById("prompt").value = item.prompt;
    });
    shots.appendChild(card);
  }
}

function remember(b64, seconds) {
  const items = loadHistory();
  items.unshift({
    at: new Date().toISOString(),
    seconds: seconds,
    model: model,
    prompt: document.getElementById("prompt").value.trim(),
    image: "data:image/png;base64," + b64,
  });
  saveHistory(items);
  renderHistory();
}

async function loadModels() {
  const option = document.createElement("option");
  option.value = model;
  option.textContent = model;
  modelSelect.appendChild(option);
  try {
    const res = await fetch("/v1/images/models", { headers: headers(false) });
    if (!res.ok) return;
    const data = await res.json();
    const rows = data.data || [];
    if (!rows.length) return;
    modelSelect.innerHTML = "";
    for (const row of rows) {
      const item = document.createElement("option");
      item.value = row.id;
      item.textContent = row.id + (row.loaded ? "" : " (not loaded)");
      if (row.id === model) item.selected = true;
      modelSelect.appendChild(item);
    }
    if (![...modelSelect.options].some(item => item.value === model)) {
      const extra = document.createElement("option");
      extra.value = model;
      extra.textContent = model;
      extra.selected = true;
      modelSelect.prepend(extra);
    }
  } catch (_) {}
}

function showImage(b64) {
  const src = "data:image/png;base64," + b64;
  frame.innerHTML = "";
  const img = document.createElement("img");
  img.alt = "Generated image";
  img.src = src;
  frame.appendChild(img);
  save.hidden = false;
  save.href = src;
}

async function readError(res) {
  const text = await res.text();
  try {
    const data = JSON.parse(text);
    return data.error?.message || data.detail || data.message || text;
  } catch {
    return text || res.statusText;
  }
}

modelSelect.addEventListener("change", () => { model = modelSelect.value; });
document.getElementById("keep10").addEventListener("click", () => {
  saveHistory(loadHistory().slice(0, 10));
  renderHistory();
});
loadModels();
renderHistory();

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  errEl.textContent = "";
  go.disabled = true;
  const started = performance.now();
  clearInterval(timer);
  meter.style.width = "0%";
  timer = setInterval(async () => {
    const seconds = ((performance.now() - started) / 1000).toFixed(0);
    let label = "generating " + seconds + "s";
    try {
      const progress = await fetch("/v1/images/progress?model=" + encodeURIComponent(model), { headers: headers(false) });
      if (progress.ok) {
        const data = await progress.json();
        if (data.active && data.total) {
          label = "step " + data.step + "/" + data.total + " · " + seconds + "s";
          meter.style.width = Math.min(100, (Number(data.step) / Number(data.total)) * 100) + "%";
        }
      }
    } catch (_) {}
    statusEl.textContent = label;
  }, 500);
  statusEl.textContent = "generating 0s";
  try {
    const prompt = document.getElementById("prompt").value.trim();
    const negative = document.getElementById("negative").value.trim();
    const size = document.getElementById("size").value;
    const steps = Number(document.getElementById("steps").value || 20);
    const seedRaw = document.getElementById("seed").value.trim();
    const file = reference.files && reference.files[0];
    let res;
    if (file) {
      const body = new FormData();
      body.append("image", file);
      body.append("prompt", prompt);
      body.append("model", model);
      body.append("size", size);
      body.append("steps", String(steps));
      body.append("n", "1");
      if (negative) body.append("negative_prompt", negative);
      if (seedRaw) body.append("seed", seedRaw);
      body.append("strength", strength.value);
      res = await fetch("/v1/images/edits", { method: "POST", headers: headers(false), body });
    } else {
      const payload = { model, prompt, size, steps, n: 1, response_format: "b64_json" };
      if (negative) payload.negative_prompt = negative;
      if (seedRaw) payload.seed = Number(seedRaw);
      res = await fetch("/v1/images/generations", {
        method: "POST",
        headers: headers(true),
        body: JSON.stringify(payload),
      });
    }
    if (!res.ok) throw new Error(await readError(res));
    const data = await res.json();
    const b64 = data.data && data.data[0] && data.data[0].b64_json;
    if (!b64) throw new Error("The server returned no image.");
    showImage(b64);
    const seconds = ((performance.now() - started) / 1000).toFixed(1);
    meter.style.width = "100%";
    remember(b64, seconds);
    statusEl.textContent = "ready " + seconds + "s · " + model;
  } catch (err) {
    const message = String(err.message || err);
    errEl.textContent = message === "Failed to fetch"
      ? "NovaMLX closed the connection. Reload this page after the app is running again."
      : message;
    statusEl.textContent = "error";
  } finally {
    clearInterval(timer);
    go.disabled = false;
  }
});
</script>
</body>
</html>
