<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaMLX · Playground</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #11141b; --border: #1e2330; --text: #e5e9f0;
    --dim: #8b93a3; --accent: #4f8cff; --user: #1c2740; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "SF Pro Text", "PingFang SC", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header a { color: var(--dim); text-decoration: none; font-size: 12px; }
  header a:hover { color: var(--text); }
  #model { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: 12px ui-monospace, monospace; max-width: 46vw; }
  #stats { margin-left: auto; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.error { align-self: center; color: var(--err); font-size: 12px; border: 1px dashed var(--err); background: none; }
  .msg .think { color: var(--dim); font-size: 12px; border-left: 2px solid var(--border); padding-left: 8px; margin-bottom: 6px; }
  .msg img { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 6px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font: 14px/1.5 inherit; resize: none; height: 44px; max-height: 160px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 16px; font: 600 13px inherit; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: var(--bg); border: 1px solid var(--border); color: var(--dim); }
</style>
</head>
<body>
<header>
  <select id="model"></select>
  <label class="ghost" id="attachRow" style="display:none;align-items:center;gap:4px;color:var(--dim);font-size:12px;cursor:pointer">
    <input type="file" id="img" accept="image/*" hidden><button class="ghost" type="button" onclick="document.getElementById('img').click()">图片</button>
  </label>
  <span id="attach"></span>
  <a href="https://github.com/cnshsliu/novamlx">novamlx</a>
  <span id="stats"></span>
</header>
<div id="log"></div>
<form id="f">
  <textarea id="q" placeholder="Enter 发送 · Shift+Enter 换行" autofocus></textarea>
  <button id="send">发送</button>
</form>
<script>
"use strict";
const params = new URLSearchParams(location.search);
let key = params.get("key") || "";
let model = params.get("model") || "";
// One page per model type: /demo/vlm keeps the image attach, /demo/chat is text-only.
const VLM = location.pathname.endsWith("/vlm");
if (VLM) document.getElementById("attachRow").style.display = "flex";
let attached = null;   // data URL for VLM messages
let busy = false, ctrl = null;

const $ = (id) => document.getElementById(id);
const headers = (json) => {
  const h = {};
  if (json) h["Content-Type"] = "application/json";
  if (key) h["Authorization"] = "Bearer " + key;
  return h;
};

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = 1e9;
  return d;
}

// Image models and decision models live in their own demos.
function routeSpecial(m) {
  if (!m) return;
  const lm = m.toLowerCase();
  const keep = "model=" + encodeURIComponent(m) + (key ? "&key=" + encodeURIComponent(key) : "");
  if (/image|flux|sdxl|stable-diffusion|z-image|zimage/.test(lm) && !lm.includes("vl")) {
    location.replace("/demo/image?" + keep); return;
  }
  if (lm.includes("laya")) { location.replace("/demo/decision?" + keep); return; }
}

async function loadModels() {
  try {
    const res = await fetch("/v1/models", { headers: headers(false) });
    const all = (await res.json()).data || [];
    const data = all.filter(m => m.nova?.type === (VLM ? "vlm" : "llm"));
    const sel = $("model");
    sel.innerHTML = "";
    for (const m of data.length ? data : all) {
      const o = document.createElement("option");
      o.value = m.id; o.textContent = m.id;
      sel.appendChild(o);
    }
    if (model && ![...sel.options].some(o => o.value === model)) {
      const o = document.createElement("option");
      o.value = model; o.textContent = model; sel.appendChild(o);
    }
    if (model) sel.value = model;
    sel.onchange = () => { model = sel.value; routeSpecial(model); };
  } catch { /* picker stays empty; manual ?model still works */ }
}

$("img").onchange = () => {
  const f = $("img").files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    attached = r.result;
    $("attach").textContent = "📷 " + f.name;
  };
  r.readAsDataURL(f);
};

async function send() {
  const text = $("q").value.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true; $("q").value = "";

  const um = add("user", text);
  if (attached) {
    const img = document.createElement("img");
    img.src = attached; um.appendChild(img);
  }

  const content = attached
    ? [{ type: "text", text }, { type: "image_url", image_url: { url: attached } }]
    : text;
  const body = {
    model, stream: true,
    messages: [...history, { role: "user", content }],
  };
  history.push({ role: "user", content: text });   // history keeps text only

  const am = add("assistant", "");
  const think = document.createElement("div");
  think.className = "think"; think.hidden = true;
  am.prepend(think);
  let out = "", th = "", t0 = performance.now(), usage = null;

  ctrl = new AbortController();
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST", headers: headers(true), signal: ctrl.signal,
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0, 140));
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        let j; try { j = JSON.parse(payload); } catch { continue; }
        if (j.usage) usage = j.usage;
        const d = j.choices?.[0]?.delta || {};
        if (d.reasoning_content) { th += d.reasoning_content; think.hidden = false; think.textContent = th; }
        if (d.content) { out += d.content; am.textContent = ""; am.appendChild(think); am.append(out); }
        $("log").scrollTop = 1e9;
      }
    }
    history.push({ role: "assistant", content: out });
    const ms = performance.now() - t0;
    const ct = usage?.completion_tokens;
    $("stats").textContent = `${Math.round(ms)}ms` + (ct ? ` · ${ct} tok · ${(ct / ms * 1000).toFixed(1)} tok/s` : "");
  } catch (e) {
    if (e.name !== "AbortError") {
      add("error", String(e.message || e));
      history.pop();
    }
  } finally {
    busy = false; ctrl = null; $("send").disabled = false; attached = null;
    $("attach").textContent = ""; $("q").focus();
  }
}

let history = [];
$("f").onsubmit = (e) => { e.preventDefault(); send(); };
$("q").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
};
// Auto-provision the key: local pages never ask the user to paste one.
if (!key) {
  fetch("/demo/session").then(r => r.json()).then(d => {
    if (d.key) key = d.key;
    else if (!d.open) keyHint();
  }).catch(keyHint);
}
function keyHint() {
  add("error", "需要 API Key —— 打开 NovaMLX app（自动生成），或在 URL 加 ?key=");
}
routeSpecial(model);
loadModels();
</script>
</body>
</html>
