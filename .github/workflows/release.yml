name: Build and Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MLX_SWIFT_REF: "main"
  MLX_SWIFT_LM_REF: "main"

jobs:
  build:
    name: Build (Apple Silicon)
    # Waits for a self-hosted Apple Silicon Mac and verifies Metal locally.
    # Pull requests, version tags, and workflow_dispatch all queue this job.
    # It does not skip, and it does not use GitHub-hosted macos-* runners.
    # Until a runner with these labels is online, the check stays queued.
    #
    # Register the runner on the Mac (MacMaxPro):
    #   Settings → Actions → Runners → New self-hosted runner → macOS / ARM64
    # Keep GitHub's default labels: self-hosted, macOS, ARM64.
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: Clone vendor dependencies
        run: |
          # mlx-swift — Apple's MLX Swift bindings (has mlx C++ submodule)
          git clone --depth 1 --branch "${MLX_SWIFT_REF}" --recurse-submodules --shallow-submodules \
            https://github.com/ml-explore/mlx-swift.git vendors/mlx-swift

          # mlx-swift-lm — LM/VLM layer on top of mlx-swift
          git clone --depth 1 --branch "${MLX_SWIFT_LM_REF}" \
            https://github.com/ml-explore/mlx-swift-lm.git mlx-swift-lm

      - name: Patch upstream StrictConcurrency issues
        run: |
          # mlx-swift-lm MediaProcessing.swift: CIContext is non-Sendable
          sed -i '' 's/^private let context = CIContext()/private nonisolated(unsafe) let context = CIContext()/' \
            mlx-swift-lm/Libraries/MLXVLM/MediaProcessing.swift

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh -c release

      - name: Run tests
        run: swift test
        continue-on-error: true

      - name: Package
        run: |
          chmod +x Scripts/package.sh
          ./Scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaMLX-arm64
          path: dist/

  release:
    name: Create GitHub Release
    needs: build
    # Uploads artifacts from the self-hosted Metal build. Does not compile
    # shaders. A tag with no online self-hosted Mac never reaches this job.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: macos-15

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NovaMLX-*.tar.gz
            dist/NovaMLX-*.dmg
          generate_release_notes: true
