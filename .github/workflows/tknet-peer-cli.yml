# Linux CLI for the standalone tknet-peer package.
# Does not clone MLX or build NovaMLX. Windows is not a supported platform
# (macOS + Linux only, user decision 2026-10-15).
name: tknet-peer CLI

on:
  push:
    branches: [main]
    paths:
      - "tknet-peer/**"
      - ".github/workflows/tknet-peer-cli.yml"
  pull_request:
    paths:
      - "tknet-peer/**"
      - ".github/workflows/tknet-peer-cli.yml"
  workflow_dispatch:

concurrency:
  group: tknet-peer-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build, test, package
        working-directory: tknet-peer
        run: |
          # swift-websocket 1.6.2's utf8.span path fails to compile on Swift 6.2 Linux.
          bash Scripts/prepare-build.sh
          swift build -c release --product tknet-peer
          swift test
          bash Scripts/check-mlx-free.sh
          bash Scripts/accept-lan-pool.sh
          bash Scripts/package-cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tknet-peer-linux
          path: tknet-peer/dist/*.tar.gz
