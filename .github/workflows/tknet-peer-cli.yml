# Linux + Windows CLI for the standalone tknet-peer package.
# Does not clone MLX or build NovaMLX. The Windows job is allowed to fail
# until that toolchain is proven (Segment 4: CLI first, GUI later).
# swift-actions/setup-swift@v2 lists Swift 6.2 for Ubuntu only; its Windows
# table stops at 5.6.3, so the Windows job installs 6.2.1 (the release that
# "6.2" resolves to on Linux) with the Swift.org Windows installer.
# windows-latest is windows-2025-vs2026. That image's MSVC 14.51 STL rejects
# Swift 6.2.1's Clang (STL1000 requires Clang 20). windows-2022 still has
# the VS 2022 toolset 6.2.1 was built against.
name: tknet-peer CLI

on:
  push:
    branches: [main]
    paths:
      - "tknet-peer/**"
      - ".github/workflows/tknet-peer-cli.yml"
  pull_request:
    paths:
      - "tknet-peer/**"
      - ".github/workflows/tknet-peer-cli.yml"
  workflow_dispatch:

concurrency:
  group: tknet-peer-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build, test, package
        working-directory: tknet-peer
        run: |
          swift build -c release --product tknet-peer
          swift test
          bash Scripts/check-mlx-free.sh
          bash Scripts/accept-lan-pool.sh
          bash Scripts/package-cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tknet-peer-linux
          path: tknet-peer/dist/*.tar.gz

  windows:
    name: Windows CLI
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
      - name: Build release CLI
        working-directory: tknet-peer
        run: swift build -c release --product tknet-peer
      - name: Package
        working-directory: tknet-peer
        shell: bash
        run: bash Scripts/package-cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tknet-peer-windows
          path: tknet-peer/dist/*.tar.gz
