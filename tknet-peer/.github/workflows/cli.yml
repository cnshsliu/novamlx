# Runs when tknet-peer/ is the repository root (after Scripts/publish-repo.sh).
# Inside cnshsliu/novamlx this file is inert; see
# .github/workflows/tknet-peer-cli.yml at the novamlx root.
name: tknet-peer CLI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tknet-peer-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build, test, package
        run: |
          swift build -c release --product tknet-peer
          swift test
          bash Scripts/check-mlx-free.sh
          bash Scripts/accept-lan-pool.sh
          bash Scripts/package-cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tknet-peer-linux
          path: dist/*.tar.gz

  windows:
    name: Windows CLI
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build release CLI
        run: swift build -c release --product tknet-peer
      - name: Package
        shell: bash
        run: bash Scripts/package-cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tknet-peer-windows
          path: dist/*.tar.gz
