# Runs when tknet-peer/ is the repository root (after Scripts/publish-repo.sh).
# Inside cnshsliu/novamlx this file is inert; see
# .github/workflows/tknet-peer-cli.yml at the novamlx root.
# macOS and Linux only (2026-10-15). No Windows job.
name: tknet-peer CLI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tknet-peer-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Verify the package with no NovaMLX sources
        env:
          TKNET_PEER_ARTIFACT_DIR: ${{ github.workspace }}/peer-dist
        run: bash Scripts/verify-standalone.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tknet-peer-linux
          path: peer-dist/*.tar.gz
